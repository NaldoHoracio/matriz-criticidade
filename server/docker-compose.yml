services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: criticidade
      POSTGRES_PASSWORD: criticidade
      POSTGRES_DB: criticidade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://criticidade:criticidade@db:5432/criticidade
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
